image: "docker.io/amdenterpriseai/aim-epyc-meta-llama-llama-3-2-3b-instruct:0.11.0-preview"

model: meta-llama/Llama-3.2-3B-Instruct

gpus: 0

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

aim:
  precision: "auto"
  gpuCount: "0"
  gpuModel: "CPU"
  engine: "vllm"
  metric: "latency"

# No GPU requests — large memory for CPU model load + KV cache.
memory: "128Gi"
cpu: "188"

probes:
  startup:
    initialDelaySeconds: 300
    periodSeconds: 15
    failureThreshold: 120

env_vars:
  AIM_ALLOW_UNOPTIMIZED: "true"
  HF_TOKEN:
    name: hf-token
    key: hf-token
